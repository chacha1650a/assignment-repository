<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>🐱</title>
<style>
  :root{
    --bg1:#fff7f5; --bg2:#f2e4e4;
    --card-bg:#fffaf5;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg1:#2a2327; --bg2:#171316;
      --card-bg:#231e1b;
    }
  }
  *{ box-sizing:border-box; }
  html,body{ height:100%; margin:0; }
  body{
    background:radial-gradient(125% 100% at 50% 0%, var(--bg1), var(--bg2));
    display:flex; align-items:center; justify-content:center;
    padding:0; overflow:hidden;
    -webkit-user-select:none; user-select:none; -webkit-tap-highlight-color:transparent;
  }
  .stage{
    position:relative; width:100%; height:100%; aspect-ratio:614/740;
    background:var(--card-bg);
  }
  canvas{ width:100%; height:100%; display:block; cursor:pointer; }
</style>
</head>
<body>

<div class="stage">
  <canvas id="cv"></canvas>
</div>

<script>
(() => {
'use strict';
const TAU = Math.PI*2;

/* ---------- 이미지 / 기준 좌표 (424x550 원본 기준) ---------- */
const TW = 424, TH = 550, PAD = 95;
const W = TW + PAD*2, H = TH + PAD*2;

const EYES   = [ {x:137, y:207, rx:19,   ry:21.5}, {x:271, y:171, rx:18.5, ry:21.5} ];
const CHEEKS = [ {x:112, y:255, r:37},             {x:319, y:194, r:37} ];
const PAW    = {x:363, y:300};
const HINTS  = [ {x:112,y:255,r:42}, {x:319,y:194,r:42} ];
const BODY_COL = '#fff9f2';
const INK_COL  = '#9c7c7c';

const COLS = 12, ROWS = 15;
const CW = TW/COLS, CH = TH/ROWS;
const NX = COLS+1, NY = ROWS+1;

/* ---------- 캔버스 ---------- */
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
const dpr = Math.min(window.devicePixelRatio || 1, 2);
cv.width = Math.round(W*dpr); cv.height = Math.round(H*dpr);
ctx.scale(dpr, dpr);

const tex = document.createElement('canvas');
tex.width = TW; tex.height = TH;
const tctx = tex.getContext('2d');

/* ---------- 상태 ---------- */
const verts = [];
const V = (i,j) => verts[j*NX + i];
let alphaMap = null;

let happy = 0, blink = 0, nextBlink = 2 + Math.random()*3;
let pointer = { x:W/2, y:H/2, inside:false }, lastMove = null;
const hearts = [];

/* ---------- 낮잠 모드 ---------- */
const NAP_DELAY = 27000;    // 27초 무입력 -> 낮잠
const zzzs = [];
let lastActivity = performance.now();
let napping = false, sleepiness = 0, nextZzz = 0;
function markActive(){ lastActivity = performance.now(); }
function spawnZzz(){
  if (zzzs.length > 5) return;
  const p = meshPoint(300, 128);
  zzzs.push({ x:p.x, y:p.y, life:1, size:11+Math.random()*3, drift:(Math.random()-0.5)*8 });
}
function drawZzz(c, z){
  c.save();
  c.globalAlpha = Math.max(0, Math.min(1, z.life));
  c.fillStyle = 'rgba(156,124,124,0.72)';
  c.font = '800 ' + Math.round(z.size) + 'px system-ui, sans-serif';
  c.textAlign = 'center'; c.textBaseline = 'middle';
  c.fillText('Z', z.x, z.y);
  c.restore();
}

/* ---------- 텍스처 삼각형 ---------- */
function drawTri(c, im, x0,y0,x1,y1,x2,y2, u0,v0,u1,v1,u2,v2){
  const gx=(x0+x1+x2)/3, gy=(y0+y1+y2)/3, E=0.75;
  const push=(x,y)=>{ const dx=x-gx, dy=y-gy, l=Math.hypot(dx,dy)||1; return [x+dx/l*E, y+dy/l*E]; };
  const p0=push(x0,y0), p1=push(x1,y1), p2=push(x2,y2);
  c.save();
  c.beginPath(); c.moveTo(p0[0],p0[1]); c.lineTo(p1[0],p1[1]); c.lineTo(p2[0],p2[1]); c.closePath(); c.clip();
  const den = u0*(v2-v1) - u1*v2 + u2*v1 + (u1-u2)*v0;
  if (den === 0){ c.restore(); return; }
  const m11 = -(v0*(x2-x1) - v1*x2 + v2*x1 + (v1-v2)*x0)/den;
  const m12 =  (v1*y2 + v0*(y1-y2) - v2*y1 + (v2-v1)*y0)/den;
  const m21 =  (u0*(x2-x1) - u1*x2 + u2*x1 + (u1-u2)*x0)/den;
  const m22 = -(u1*y2 + u0*(y1-y2) - u2*y1 + (u2-u1)*y0)/den;
  const dx  =  (u0*(v2*x1 - v1*x2) + v0*(u1*x2 - u2*x1) + (u2*v1 - u1*v2)*x0)/den;
  const dy  =  (u0*(v2*y1 - v1*y2) + v0*(u1*y2 - u2*y1) + (u2*v1 - u1*v2)*y0)/den;
  c.transform(m11, m12, m21, m22, dx, dy);
  c.drawImage(im, 0, 0);
  c.restore();
}

/* ---------- 표정 ---------- */
const IMG = new Image();

function paintTexture(){
  tctx.clearRect(0,0,TW,TH);
  tctx.drawImage(IMG, 0, 0, TW, TH);

  // 기분 좋으면 볼이 더 발그레 (쓰다듬기 반응)
  if (happy > 0.05){
    tctx.save();
    tctx.globalAlpha = happy*0.45;
    for (const c of CHEEKS){
      const g = tctx.createRadialGradient(c.x, c.y, 2, c.x, c.y, c.r);
      g.addColorStop(0, '#ffb3ac'); g.addColorStop(1, 'rgba(255,179,172,0)');
      tctx.fillStyle = g;
      tctx.beginPath(); tctx.arc(c.x, c.y, c.r, 0, TAU); tctx.fill();
    }
    tctx.restore();
  }

  const arc = Math.max(0, (happy - 0.30)/0.70);          // 웃는 눈
  const flat = Math.max(blink, sleepiness);               // 깜빡임 / 낮잠
  if (arc < 0.02 && flat < 0.02) return;

  for (const e of EYES){
    tctx.fillStyle = BODY_COL;
    tctx.beginPath(); tctx.ellipse(e.x, e.y, e.rx+2, e.ry+2, 0, 0, TAU); tctx.fill();

    tctx.fillStyle = INK_COL;
    tctx.strokeStyle = INK_COL;
    tctx.lineCap = 'round';

    if (arc > 0.02){
      tctx.lineWidth = 8;
      tctx.beginPath();
      tctx.moveTo(e.x - e.rx, e.y + e.ry*0.30);
      tctx.quadraticCurveTo(e.x, e.y - e.ry*(0.25 + 1.35*arc), e.x + e.rx, e.y + e.ry*0.30);
      tctx.stroke();
    } else {
      const k = 1 - flat;
      if (k > 0.06){
        tctx.beginPath();
        tctx.ellipse(e.x, e.y, e.rx, Math.max(3, e.ry*k), 0, 0, TAU);
        tctx.fill();
      } else {
        tctx.lineWidth = 7;
        tctx.beginPath();
        tctx.moveTo(e.x - e.rx, e.y);
        tctx.lineTo(e.x + e.rx, e.y);
        tctx.stroke();
      }
    }
  }
}

/* ---------- 좌표 ---------- */
function toCanvas(e){
  const r = cv.getBoundingClientRect();
  return { x:(e.clientX-r.left)/r.width*W, y:(e.clientY-r.top)/r.height*H };
}
function nearestVertex(px, py){
  let best = null, bd = Infinity;
  for (const v of verts){
    const d = (v.x-px)*(v.x-px) + (v.y-py)*(v.y-py);
    if (d < bd){ bd = d; best = v; }
  }
  return { v:best, dist:Math.sqrt(bd) };
}
function meshPoint(u, v){
  const fi = Math.max(0, Math.min(COLS-0.001, u/CW));
  const fj = Math.max(0, Math.min(ROWS-0.001, v/CH));
  const i = fi|0, j = fj|0, s = fi-i, t = fj-j;
  const a = V(i,j), b = V(i+1,j), c = V(i,j+1), d = V(i+1,j+1);
  return { x:(a.x*(1-s)+b.x*s)*(1-t) + (c.x*(1-s)+d.x*s)*t,
           y:(a.y*(1-s)+b.y*s)*(1-t) + (c.y*(1-s)+d.y*s)*t };
}
function nearSolid(i, j){
  for (let dj=-1; dj<=2; dj++) for (let di=-1; di<=2; di++){
    const ii=i+di, jj=j+dj;
    if (ii<0||jj<0||ii>=NX||jj>=NY) continue;
    if (V(ii,jj).solid) return true;
  }
  return false;
}

/* ---------- 하트 ---------- */
function spawnHeart(x, y){
  if (hearts.length > 36) return;
  hearts.push({ x, y, vx:(Math.random()-0.5)*0.7, vy:-0.8-Math.random()*0.8,
                life:1, size:9+Math.random()*11, rot:(Math.random()-0.5)*0.6 });
}
function drawHeart(c, x, y, s, a, rot){
  c.save(); c.translate(x,y); c.rotate(rot); c.globalAlpha = a;
  c.fillStyle = '#f79aa0';
  c.beginPath();
  c.moveTo(0, s*0.32);
  c.bezierCurveTo( s*0.60, -s*0.25,  s*0.28, -s*0.78, 0, -s*0.34);
  c.bezierCurveTo(-s*0.28, -s*0.78, -s*0.60, -s*0.25, 0, s*0.32);
  c.fill(); c.restore();
}

/* ---------- 입력: 볼 쓰다듬기만 ---------- */
cv.addEventListener('pointermove', (e) => {
  const p = toCanvas(e);
  pointer.x = p.x; pointer.y = p.y; pointer.inside = true;
  markActive();
  const { v, dist } = nearestVertex(p.x, p.y);
  if (v && v.solid && dist < 44 && lastMove){
    const d = Math.hypot(p.x-lastMove.x, p.y-lastMove.y);
    if (d < 90){
      happy = Math.min(1, happy + d*0.0024);
      if (happy > 0.22 && Math.random() < d*0.012) spawnHeart(p.x, p.y);
    }
  }
  lastMove = p;
}, { passive:true });

cv.addEventListener('pointerleave', () => { pointer.inside = false; lastMove = null; });

/* ---------- 루프 ---------- */
let prev = performance.now();
function frame(now){
  const dt = Math.max(0, Math.min(0.05, (now-prev)/1000)); prev = now;
  const t = now/1000;

  happy = Math.max(0, happy - dt*0.12);

  napping = (now - lastActivity) > NAP_DELAY;
  if (napping) sleepiness = Math.min(1, sleepiness + dt*0.7);
  else sleepiness = Math.max(0, sleepiness - dt*3.5);
  nextZzz -= dt;
  if (napping && sleepiness > 0.6 && nextZzz <= 0){
    spawnZzz();
    nextZzz = 1.3 + Math.random()*0.9;
  }

  nextBlink -= dt;
  if (nextBlink <= 0){ nextBlink = 2.2 + Math.random()*3.8; blink = 1; }
  blink = Math.max(0, blink - dt*7.5);

  for (const v of verts){
    let tx = v.ox, ty = v.oy;

    // 숨쉬기 (낮잠 중엔 느리고 깊게)
    const breathRate = 1.6 - sleepiness*1.0;
    const breathAmp  = 0.005 + happy*0.008 + sleepiness*0.006;
    const s = 1 + Math.sin(t*breathRate)*breathAmp;
    tx = TW/2 + (tx - TW/2)*s;
    ty = TH   + (ty - TH  )*s;

    // 좌우 살랑
    tx += Math.sin(t*0.9)*3*(1 - v.oy/TH);

    // 귀 씰룩
    if (v.oy < 130){
      const k = (130 - v.oy)/130;
      tx += Math.sin(t*13 + (v.ox < TW/2 ? 0 : 1.9))*4*k*happy*0.9;
    }

    // 손 흔들기 (기분 좋을 때)
    if (happy > 0.45){
      const dw = Math.hypot(v.ox-PAW.x, v.oy-PAW.y);
      if (dw < 130){
        const k = (1 - dw/130)*(happy-0.45)/0.55;
        tx += Math.sin(t*9)*16*k;
        ty += Math.cos(t*9)*5*k;
      }
    }

    // 골골 진동
    if (happy > 0.35) ty += Math.sin(t*46 + v.ox*0.05)*0.8*happy;

    tx += PAD; ty += PAD;

    v.vx = (v.vx + (tx-v.x)*0.30)*0.80;
    v.vy = (v.vy + (ty-v.y)*0.30)*0.80;
    v.x += v.vx; v.y += v.vy;
  }

  paintTexture();
  ctx.clearRect(0,0,W,H);

  // 바닥 그림자
  ctx.save();
  ctx.globalAlpha = 0.13; ctx.fillStyle = '#8a6f6f';
  ctx.filter = 'blur(10px)';
  ctx.beginPath();
  ctx.ellipse(W/2, PAD + TH - 6, TW*0.30, 16, 0, 0, TAU);
  ctx.fill();
  ctx.restore();

  for (let j=0;j<ROWS;j++){
    for (let i=0;i<COLS;i++){
      if (!nearSolid(i,j)) continue;
      const a = V(i,j), b = V(i+1,j), c = V(i+1,j+1), d = V(i,j+1);
      const u0 = i*CW, v0 = j*CH, u1 = u0+CW, v1 = v0+CH;
      drawTri(ctx, tex, a.x,a.y, b.x,b.y, c.x,c.y, u0,v0, u1,v0, u1,v1);
      drawTri(ctx, tex, a.x,a.y, c.x,c.y, d.x,d.y, u0,v0, u1,v1, u0,v1);
    }
  }

  // 쓰다듬을 곳 힌트 (볼 두 군데)
  if (happy < 0.5){
    const pulse = 0.14 + 0.10*Math.sin(t*2.4);
    for (const c of HINTS){
      const p = meshPoint(c.x, c.y);
      ctx.save();
      ctx.strokeStyle = 'rgba(230,140,140,' + pulse.toFixed(3) + ')';
      ctx.lineWidth = 2; ctx.setLineDash([6,7]);
      ctx.beginPath(); ctx.arc(p.x, p.y, c.r, 0, TAU); ctx.stroke();
      ctx.restore();
    }
  }

  for (let i=hearts.length-1;i>=0;i--){
    const h = hearts[i];
    h.x += h.vx; h.y += h.vy; h.vy -= 0.013; h.life -= dt*0.8;
    if (h.life <= 0){ hearts.splice(i,1); continue; }
    drawHeart(ctx, h.x, h.y, h.size, Math.min(1,h.life)*0.85, h.rot + Math.sin(t*2+h.x)*0.15);
  }

  for (let i=zzzs.length-1;i>=0;i--){
    const z = zzzs[i];
    z.y -= 0.38; z.x += z.drift*dt; z.size += dt*3.4; z.life -= dt*0.42;
    if (z.life <= 0){ zzzs.splice(i,1); continue; }
    drawZzz(ctx, z);
  }

  requestAnimationFrame(frame);
}

/* ---------- 시작 ---------- */
IMG.onload = () => {
  const probe = document.createElement('canvas');
  probe.width = TW; probe.height = TH;
  const pc = probe.getContext('2d');
  pc.drawImage(IMG, 0, 0, TW, TH);
  alphaMap = pc.getImageData(0, 0, TW, TH).data;
  const solidAt = (x, y) => {
    const ix = Math.max(0, Math.min(TW-1, Math.round(x)));
    const iy = Math.max(0, Math.min(TH-1, Math.round(y)));
    return alphaMap[(iy*TW + ix)*4 + 3] > 24;
  };
  for (let j=0;j<NY;j++) for (let i=0;i<NX;i++){
    const ox = i*CW, oy = j*CH;
    verts.push({ ox, oy, x:ox+PAD, y:oy+PAD, vx:0, vy:0, w:0, solid:solidAt(ox, oy) });
  }
  requestAnimationFrame(frame);
};
IMG.onerror = () => {
  const c = ctx;
  c.save();
  c.fillStyle = '#e8827a';
  c.font = '600 20px system-ui, sans-serif';
  c.textAlign = 'center';
  c.fillText('이미지를 불러오지 못했어요', W/2, H/2);
  c.restore();
