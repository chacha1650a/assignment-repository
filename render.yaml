# Render Blueprint — 7번째 과제(로그인 기능)의 인증 백엔드 배포 설정
#
# Render 대시보드에서 New + → Blueprint → 이 저장소를 고르면
# 아래 설정대로 서비스가 자동으로 만들어집니다.
#
# SESSION_SECRET 은 generateValue: true 라서 Render가 임의의 긴 값을 직접 만들어
# 서비스 환경변수에만 넣어 줍니다. 저장소에는 그 값이 남지 않습니다.
#
# DATABASE_URL 은 sync: false 라서 Render가 자동으로 채우지 않고, 만드는 사람이
# Neon 같은 관리형 Postgres에서 발급받은 연결 문자열을 직접 붙여 넣어야 합니다.
# (2026-09-09: Render 무료 플랜 디스크가 재시작마다 초기화되는 걸 실제로 겪은 뒤,
#  SQLite 파일 대신 관리형 Postgres로 옮겼습니다. 이제 이 서비스 자체는 재시작해도
#  데이터가 사라지지 않습니다 — DB가 Render 밖에 있으니까요.)

services:
  - type: web
    name: mochi-diary-auth-backend
    runtime: node
    plan: free
    region: singapore
    rootDir: mochi-diary-auth-backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: SESSION_SECRET
        generateValue: true      # Render가 만들어 넣어 줌 (git에는 안 들어감)
      - key: SESSION_TTL_HOURS
        value: "12"
      - key: BCRYPT_ROUNDS
        value: "12"
      - key: DATABASE_URL
        sync: false             # Neon 등에서 받은 postgres://... 연결 문자열을 직접 입력
