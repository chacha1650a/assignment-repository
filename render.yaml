# Render Blueprint — 7번째 과제(로그인 기능)의 인증 백엔드 배포 설정
#
# Render 대시보드에서 New + → Blueprint → 이 저장소를 고르면
# 아래 설정대로 서비스가 자동으로 만들어집니다.
#
# SESSION_SECRET 은 generateValue: true 라서 Render가 임의의 긴 값을 직접 만들어
# 서비스 환경변수에만 넣어 줍니다. 저장소에는 그 값이 남지 않습니다.
#
# 주의: free 플랜은 디스크가 영구 저장이 아니라, 다시 배포하면 diary-auth.db 가
# 초기화됩니다(계정과 일기가 함께 사라집니다). 과제 제출·검증 용도로는 충분하지만
# 오래 쓰려면 유료 디스크나 관리형 DB로 옮겨야 합니다.

services:
  - type: web
    name: mochi-diary-auth-backend
    runtime: node
    plan: free
    region: singapore
    rootDir: mochi-diary-auth-backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: SESSION_SECRET
        generateValue: true      # Render가 만들어 넣어 줌 (git에는 안 들어감)
      - key: SESSION_TTL_HOURS
        value: "12"
      - key: BCRYPT_ROUNDS
        value: "12"
      # node:sqlite 는 Node 22.13.0 부터 플래그 없이 쓸 수 있다.
      # 22.11.0 으로 두면 require('node:sqlite') 가 ERR_UNKNOWN_BUILTIN_MODULE 로
      # 죽어서 배포가 실패한다(실제로 한 번 겪었다).
      - key: NODE_VERSION
        value: "22.20.0"

  # ---------------------------------------------------------------
  # 8번째 과제(패스키 등록)의 백엔드.
  # 7번 서비스(mochi-diary-auth-backend)는 손대지 않고, 별도 서비스로 새로 띄웁니다.
  # 7번 제출물이 지금도 그대로 열려야 하기 때문입니다.
  #
  # RP_ID 는 "이 패스키가 어느 도메인의 열쇠인가"를 못박는 값입니다.
  # 화면이 올라가 있는 도메인과 정확히 같아야 하고, 다르면 브라우저가 등록·로그인을 거절합니다.
  # (백엔드가 onrender.com 에 있어도 RP_ID 는 화면 도메인인 github.io 입니다)
  # ---------------------------------------------------------------
  - type: web
    name: daehoon-passkey-backend
    runtime: node
    plan: free
    region: singapore
    rootDir: passkey-backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: SESSION_SECRET
        generateValue: true      # Render가 만들어 넣어 줌 (git에는 안 들어감)
      - key: SESSION_TTL_HOURS
        value: "12"
      - key: CHALLENGE_TTL_SECONDS
        value: "120"
      - key: RP_ID
        value: "chacha1650a.github.io"
      - key: RP_NAME
        value: "김대훈 포트폴리오 — 비공개 서랍"
      - key: EXPECTED_ORIGINS
        value: "https://chacha1650a.github.io"
      # node:sqlite 는 Node 22.13.0 부터 플래그 없이 쓸 수 있다.
      - key: NODE_VERSION
        value: "22.20.0"
